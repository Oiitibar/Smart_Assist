services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: smart-assist-api:local
    container_name: smart-assist-api
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 5000
      LIBREOFFICE_PATH: /usr/bin/soffice
    ports:
      - "5000:5000"

    # These mounts are only for local Docker testing.
    # previews is deliberately NOT mounted, so it remains temporary.
    volumes:
      - ./uploads/avatars:/app/uploads/avatars
      - ./uploads/materials:/app/uploads/materials:ro

    restart: unless-stopped
